<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>교회 구석에서 묻는 질문들 소그룹</title>
<meta property="og:title" content="교회 구석에서 묻는 질문들 소그룹">
<style>:root{--accent:#018327;--bg:#FFFFFF}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
background:var(--bg);color:#26221D;line-height:1.65;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}h1{font-size:24px;line-height:1.35;margin:8px 0 4px}
h2{font-size:18px;margin:28px 0 8px}.muted{color:#6E665C;font-size:14px}.card{background:#fff;border:1px solid #E7E0D5;border-radius:12px;padding:14px 16px;margin:10px 0}
.label{color:var(--accent);font-weight:700;font-size:13px}.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
font-weight:700;padding:14px;border-radius:12px;margin:10px 0}.btn.plain{background:#fff;color:var(--accent);border:1px solid #E7E0D5}
a{color:var(--accent)}img.icon{width:72px;height:72px;border-radius:16px}img.cover{width:120px;border-radius:6px;box-shadow:0 4px 14px #0002}ul{padding-left:20px}
</style></head><body><main>
<img class="cover" src="cover.jpg" alt="『교회 구석에서 묻는 질문들』 표지">
<h1>교회 구석에서 묻는 질문들 소그룹</h1>
<p class="muted">『교회 구석에서 묻는 질문들』(오성민, 복 있는 사람) 독자를 위한 소그룹 운영 앱</p>
<div id="invite"></div>
<h2>앱 설치</h2>
<p class="muted">App Store 출시 준비 중입니다.</p>
<a class="btn plain" href="https://play.google.com/store/apps/details?id=com.appenter.questions.guseok">Google Play에서 받기</a>
<p class="muted">설치한 뒤 카톡의 초대 링크를 다시 누르거나, 앱의 '초대 링크로 참여'에 링크를 붙여 넣으세요.</p>
<p class="muted"><a href="../support.html">도움말</a> · <a href="../privacy.html">개인정보처리방침</a></p>
</main><script>
const CH={"Q1": ["그리스도인이 되려면 이전 생활을 모두 포기해야 할까?", 18, 27], "Q2": ["그리스도인이 술을 마셔도 될까?", 28, 43], "Q3": ["그리스도인끼리 질투하지 않을 수 없을까?", 44, 55], "Q4": ["우울증을 기도로만 극복할 수 있을까?", 56, 70], "Q5": ["주일성수가 우리의 신앙을 보장해 줄까?", 72, 86], "Q6": ["오직 은혜라면서 왜 율법도 지키라고 말할까?", 87, 96], "Q7": ["대형 예배당 건축이 정말 하나님의 뜻일까?", 97, 111], "Q8": ["예수천국 불신지옥은 최선의 전도일까?", 112, 125], "Q9": ["성경 속 기적들이 실제로 일어날 수 있을까?", 128, 145], "Q10": ["성경은 차별과 노예제를 지지할까?", 146, 163], "Q11": ["복음을 들어 볼 기회가 없었던 사람들은 지옥에 갈까?", 164, 186], "Q12": ["그리스도인은 동성애를 특별한 죄로 여겨야 할까?", 187, 201], "Q13": ["예수님이 이 땅에 오신 게 나와 무슨 상관일까?", 204, 224], "Q14": ["과학과 철학의 발전이 신을 죽였을까?", 225, 242], "Q15": ["신의 존재를 믿을 만한 근거들이 있을까?", 243, 266], "Q16": ["하나님을 믿는다는 것은 무슨 뜻일까?", 267, 279]},FMT={"sharing": "나눔형", "lecture": "강의 후 나눔형"};
const SCHEME='appenter-guseok',PKG='com.appenter.questions.guseok',PLAY='https://play.google.com/store/apps/details?id=com.appenter.questions.guseok';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decode(d){const b=atob(d.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(decodeURIComponent(b.split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')))}
function label(local){const [d,t]=local.split('T'),[y,m,day]=d.split('-').map(Number),w='일월화수목금토'[new Date(y,m-1,day).getDay()];return m+'/'+day+'('+w+') '+t}
const data=location.hash.slice(1);
if(data){try{const v=decode(data);if(v.book!=='guseok')throw 0;
const open=/Android/i.test(navigator.userAgent)?'intent://join?d='+data+'#Intent;scheme='+SCHEME+';package='+PKG+';S.browser_fallback_url='+encodeURIComponent(PLAY)+';end':SCHEME+'://join?d='+data;
let h='<div class="card"><div class="label">초대 받은 모임</div><h1>'+esc(v.name)+'</h1><p class="muted">'+v.sessions.length+'회 · 리더가 정한 일정입니다</p>'
+'<a class="btn" href="'+open+'">앱에서 열기</a></div><h2>일정</h2>';
v.sessions.forEach((s,i)=>{h+='<div class="card"><div class="label">'+(i+1)+'회 · '+esc(label(s.date))+' · '+esc(FMT[s.format]||'')+'</div>'
+s.chapters.map(id=>{const c=CH[id];return c?'<div>'+id+'. '+esc(c[0])+' <span class="muted">('+c[1]+'-'+c[2]+'쪽)</span></div>':''}).join('')+'</div>'});
document.getElementById('invite').innerHTML=h+'<p class="muted">나눌 질문은 앱에서 볼 수 있습니다.</p>';
}catch(e){document.getElementById('invite').innerHTML='<div class="card">초대 링크를 읽을 수 없습니다. 링크 전체를 다시 확인해 주세요.</div>'}}
</script></body></html>

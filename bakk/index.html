<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>교회 밖에서 묻는 질문들 소그룹</title>
<meta property="og:title" content="교회 밖에서 묻는 질문들 소그룹">
<style>:root{--accent:#1F5C66;--bg:#F4F8F8}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
background:var(--bg);color:#26221D;line-height:1.65;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:24px 16px 64px}h1{font-size:24px;line-height:1.35;margin:8px 0 4px}
h2{font-size:18px;margin:28px 0 8px}.muted{color:#6E665C;font-size:14px}.card{background:#fff;border:1px solid #E7E0D5;border-radius:12px;padding:14px 16px;margin:10px 0}
.label{color:var(--accent);font-weight:700;font-size:13px}.btn{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;
font-weight:700;padding:14px;border-radius:12px;margin:10px 0}.btn.plain{background:#fff;color:var(--accent);border:1px solid #E7E0D5}
a{color:var(--accent)}img.icon{width:72px;height:72px;border-radius:16px}ul{padding-left:20px}
</style></head><body><main>
<img class="icon" src="icon.png" alt="">
<h1>교회 밖에서 묻는 질문들 소그룹</h1>
<p class="muted">『교회 밖에서 묻는 질문들』(오성민, 복 있는 사람) 독자를 위한 소그룹 운영 앱</p>
<div id="invite"></div>
<h2>앱 설치</h2>
<p class="muted">App Store 출시 준비 중입니다.</p>
<a class="btn plain" href="https://play.google.com/store/apps/details?id=com.appenter.questions.bakk">Google Play에서 받기</a>
<p class="muted">설치한 뒤 카톡의 초대 링크를 다시 누르거나, 앱의 '초대 링크로 참여'에 링크를 붙여 넣으세요.</p>
<p class="muted"><a href="../support.html">도움말</a> · <a href="../privacy.html">개인정보처리방침</a></p>
</main><script>
const CH={"Q1": ["교회는 왜 헌금을 걷는가?", 22, 27], "Q2": ["교회 다니는 사람들이 왜 더 탐욕스러워 보이는가?", 28, 35], "Q3": ["종교는 애초에 지배를 위한 발명품인가?", 36, 39], "Q4": ["종교야말로 전쟁과 폭력의 가장 큰 원인이 아닌가?", 40, 47], "Q5": ["일반 교회가 사이비와 다른 점이 뭔가?", 48, 51], "Q6": ["교회에는 왜 이렇게 종파가 많은가?", 52, 58], "Q7": ["교회는 왜 동성애자를 차별하는가?", 59, 66], "Q8": ["결국 종교는 정신 승리 아닌가?", 67, 76], "Q9": ["왜 교회에는 유독 이상한 사람들이 많은가?", 78, 86], "Q10": ["어린아이를 교회에 데려가는 건 세뇌가 아닌가?", 87, 96], "Q11": ["교회에 다니지 않고 혼자서 신을 믿을 수는 없는가?", 97, 102], "Q12": ["일요일마다 모여서 대체 뭘 하는가?", 103, 108], "Q13": ["교인들은 왜 그렇게 감정적인가?", 109, 116], "Q14": ["기도해도 안 이루어지던데 왜 하는가?", 117, 125], "Q15": ["하나님을 만난다는 게 무슨 말인가?", 126, 134], "Q16": ["사람이 해놓고 왜 하나님의 뜻이라고 말하는가?", 135, 143], "Q17": ["기독교를 믿으면 뭐가 좋은가?", 144, 157], "Q18": ["신을 믿는다는 게 정확히 무슨 뜻인가?", 160, 163], "Q19": ["신이 존재한다는 증거가 있는가?", 164, 177], "Q20": ["과학과 종교는 양립할 수 없지 않은가?", 178, 186], "Q21": ["기독교는 현대 과학을 부정하는가?", 187, 195], "Q22": ["예수가 실존 인물이라는 증거가 있는가?", 196, 205], "Q23": ["신의 말씀이라는 성경에 왜 오류가 있는가?", 206, 213], "Q24": ["21세기에 기적이라니, 말이 되는가?", 214, 222], "Q25": ["기독교인들은 왜 예수가 부활했다고 믿는가?", 223, 233], "Q26": ["모든 종교는 결국 같은 말을 하지 않는가?", 234, 240], "Q27": ["모든 종교를 알아보지도 않고 어떻게 하나를 고르는가?", 241, 246], "Q28": ["왜 기독교는 인간을 죄인이라고 말하는가?", 248, 255], "Q29": ["사랑의 신이라면서 어떻게 사람을 지옥에 보내는가?", 256, 267], "Q30": ["범죄자도 믿기만 하면 구원을 받을 수 있는가?", 268, 276], "Q31": ["예수를 몰랐던 이순신 장군은 지옥에 갔는가?", 277, 280], "Q32": ["구약의 학살 명령은 신의 잔혹성을 보여주는 게 아닌가?", 281, 292], "Q33": ["신이 전지전능하다면 왜 고통과 악이 있는가?", 293, 304], "Q34": ["왜 기독교는 예수의 가르침을 따르지 않는가?", 305, 316], "Q35": ["그래서 이 모든 게 무교인 나와 무슨 상관인가?", 317, 333]},FMT={"sharing": "나눔형", "lecture": "강의 후 나눔형", "booktalk": "1:1 북토크·커피챗형"};
const SCHEME='appenter-bakk',PKG='com.appenter.questions.bakk',PLAY='https://play.google.com/store/apps/details?id=com.appenter.questions.bakk';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function decode(d){const b=atob(d.replace(/-/g,'+').replace(/_/g,'/'));return JSON.parse(decodeURIComponent(b.split('').map(c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join('')))}
function label(local){const [d,t]=local.split('T'),[y,m,day]=d.split('-').map(Number),w='일월화수목금토'[new Date(y,m-1,day).getDay()];return m+'/'+day+'('+w+') '+t}
const data=location.hash.slice(1);
if(data){try{const v=decode(data);if(v.book!=='bakk')throw 0;
const open=/Android/i.test(navigator.userAgent)?'intent://join?d='+data+'#Intent;scheme='+SCHEME+';package='+PKG+';S.browser_fallback_url='+encodeURIComponent(PLAY)+';end':SCHEME+'://join?d='+data;
let h='<div class="card"><div class="label">초대 받은 모임</div><h1>'+esc(v.name)+'</h1><p class="muted">'+v.sessions.length+'회 · 리더가 정한 일정입니다</p>'
+'<a class="btn" href="'+open+'">앱에서 열기</a></div><h2>일정</h2>';
v.sessions.forEach((s,i)=>{h+='<div class="card"><div class="label">'+(i+1)+'회 · '+esc(label(s.date))+' · '+esc(FMT[s.format]||'')+'</div>'
+s.chapters.map(id=>{const c=CH[id];return c?'<div>'+id+'. '+esc(c[0])+' <span class="muted">('+c[1]+'-'+c[2]+'쪽)</span></div>':''}).join('')+'</div>'});
document.getElementById('invite').innerHTML=h+'<p class="muted">나눌 질문은 앱에서 볼 수 있습니다.</p>';
}catch(e){document.getElementById('invite').innerHTML='<div class="card">초대 링크를 읽을 수 없습니다. 링크 전체를 다시 확인해 주세요.</div>'}}
</script></body></html>
